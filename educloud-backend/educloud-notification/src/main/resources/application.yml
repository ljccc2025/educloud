server:
  port: 8097

spring:
  application:
    name: educloud-notification
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${EDUCLOUD_NOTIFICATION_NACOS_USERNAME:${NACOS_ADMIN_USERNAME:nacos}}
      password: ${EDUCLOUD_NOTIFICATION_NACOS_PASSWORD:${NACOS_ADMIN_PASSWORD:nacos}}
      discovery:
        username: ${EDUCLOUD_NOTIFICATION_NACOS_USERNAME:${NACOS_ADMIN_USERNAME:nacos}}
        password: ${EDUCLOUD_NOTIFICATION_NACOS_PASSWORD:${NACOS_ADMIN_PASSWORD:nacos}}
        namespace: ${NACOS_GATEWAY_NAMESPACE:educloud-local}
        group: ${NACOS_GATEWAY_DISCOVERY_GROUP:EDUCLOUD_SERVICES}
        register-enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/educloud_notification?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${EDUCLOUD_NOTIFICATION_DB_USERNAME:${MYSQL_USERNAME:notification_app}}
    password: ${EDUCLOUD_NOTIFICATION_DB_PASSWORD:${EDUCLOUD_ORDER_DB_PASSWORD:b97ac137f154ee3561da13eb792c502f7e2a4c357ed7cf95}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_DEFAULT_PASS:${RABBITMQ_PASSWORD:guest}}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:educloud}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  server:
    port: 8098

educloud:
  environment: ${EDUCLOUD_ENVIRONMENT:prod}
  notification:
    environment: ${EDUCLOUD_ENVIRONMENT:prod}
    jwt:
      jwks-location: ${NOTIFICATION_JWKS_LOCATION:file:/tmp/educloud-live/jwks.json}
      issuer: ${EDUCLOUD_NOTIFICATION_JWT_ISSUER:https://issuer.educloud.local}
      audience: ${EDUCLOUD_NOTIFICATION_JWT_AUDIENCE:educloud-api}
    internal:
      audience: ${EDUCLOUD_NOTIFICATION_INTERNAL_AUDIENCE:educloud-notification}
      allowed-client-ids: ${EDUCLOUD_NOTIFICATION_INTERNAL_ALLOWED_CLIENT_IDS:gateway,user-service,educloud-order,educloud-course,educloud-content,educloud-file,educloud-payment,educloud-live}
      secret-token: ${EDUCLOUD_NOTIFICATION_INTERNAL_SECRET:educloud-internal-secret}
    email:
      provider: ${EDUCLOUD_EMAIL_PROVIDER:mock}
      host: ${EDUCLOUD_SMTP_HOST:smtp.educloud.local}
      port: ${EDUCLOUD_SMTP_PORT:465}
      username: ${EDUCLOUD_SMTP_USERNAME:support@educloud.cn}
      password: ${EDUCLOUD_SMTP_PASSWORD:secret_smtp_token}
      from: ${EDUCLOUD_SMTP_FROM:EduCloud Notifications <support@educloud.cn>}
      ssl-enabled: true

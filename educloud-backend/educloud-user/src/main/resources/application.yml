server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: educloud-user
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # M03: 本地通过未提交的 .env 注入；生产由 Kubernetes Secret 注入。账号 user_app 无库级写权限（见 deploy/docker-compose/mysql/init/001-create-databases.sh）。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/educloud_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: user_app
    password: ${EDUCLOUD_USER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:}
    password: ${RABBITMQ_DEFAULT_PASS:}
    # M03: 与 compose 的 RABBITMQ_DEFAULT_VHOST 对齐（默认 educloud）；缺省会让凭据在 vhost "/" 上认证失败。
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:educloud}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${EDUCLOUD_USER_NACOS_USERNAME:}
      password: ${EDUCLOUD_USER_NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_GATEWAY_NAMESPACE:educloud-local}
        group: ${NACOS_GATEWAY_DISCOVERY_GROUP:EDUCLOUD_SERVICES}
        register-enabled: true

educloud:
  user:
    # M03: 会话 Redis key 的 environment 必须与 Gateway 的 educloud.gateway.environment 同源（同一 EDUCLOUD_ENVIRONMENT）。
    # 依据：M02 RedisSessionVerifier 使用 educloud:{environment:auth}:session:{sid}。
    session:
      environment: ${EDUCLOUD_ENVIRONMENT:local}
      access-token-ttl: ${EDUCLOUD_USER_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${EDUCLOUD_USER_REFRESH_TOKEN_TTL:7d}
      rotation-grace-window: ${EDUCLOUD_USER_ROTATION_GRACE_WINDOW:5s}
      cookie-secure: ${EDUCLOUD_USER_COOKIE_SECURE:false}
    jwt:
      private-key-location: ${USER_JWT_PRIVATE_KEY_LOCATION:}
      issuer: ${EDUCLOUD_USER_JWT_ISSUER:https://issuer.educloud.local}
      audience: ${EDUCLOUD_USER_JWT_AUDIENCE:educloud-api}
      service-token-ttl: ${EDUCLOUD_USER_SERVICE_TOKEN_TTL:5m}
    registration:
      enabled: ${EDUCLOUD_USER_REGISTRATION_ENABLED:true}
      rate-limit:
        enabled: ${EDUCLOUD_USER_REGISTRATION_RATE_LIMIT_ENABLED:true}
        ip-max-attempts: ${EDUCLOUD_USER_REGISTRATION_IP_MAX_ATTEMPTS:5}
        device-max-attempts: ${EDUCLOUD_USER_REGISTRATION_DEVICE_MAX_ATTEMPTS:3}
        window: ${EDUCLOUD_USER_REGISTRATION_RATE_LIMIT_WINDOW:5m}
    login:
      max-failed-attempts: ${EDUCLOUD_USER_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${EDUCLOUD_USER_LOCK_DURATION:15m}
    internal:
      bootstrap-key: ${EDUCLOUD_USER_INTERNAL_BOOTSTRAP_KEY:}
      allowed-client-ids: ${EDUCLOUD_USER_INTERNAL_ALLOWED_CLIENT_IDS:}
      audience: ${EDUCLOUD_USER_INTERNAL_AUDIENCE:educloud-user}
    # M04 任务 14: File 服务内部联调。默认禁用，本地无 File 服务时 User 完全可用；
    # enabled=true 时 FileClient 以 user-service 服务令牌调用 File /internal/v1/**。
    file:
      endpoint: ${EDUCLOUD_USER_FILE_ENDPOINT:http://127.0.0.1:8087}
      client-id: ${EDUCLOUD_USER_FILE_CLIENT_ID:user-service}
      client-secret: ${EDUCLOUD_USER_FILE_CLIENT_SECRET:}
      enabled: ${EDUCLOUD_USER_FILE_ENABLED:false}
      timeout: ${EDUCLOUD_USER_FILE_TIMEOUT:3s}
    inbox:
      poll-interval: ${EDUCLOUD_USER_INBOX_POLL_INTERVAL:5000}
    password:
      min-length: ${EDUCLOUD_USER_PASSWORD_MIN_LENGTH:8}
      max-length: ${EDUCLOUD_USER_PASSWORD_MAX_LENGTH:128}
      bcrypt-strength: ${EDUCLOUD_USER_BCRYPT_STRENGTH:10}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted

management:
  server:
    address: ${USER_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${USER_MANAGEMENT_PORT:8083}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,userDependencies
      show-details: never
  tracing:
    sampling:
      probability: ${EDUCLOUD_USER_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.educloud.user: INFO

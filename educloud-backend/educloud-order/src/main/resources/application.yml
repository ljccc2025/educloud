server:
  port: 8091

spring:
  application:
    name: educloud-order
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.136}:${MYSQL_PORT:3306}/educloud_order?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.136}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.100.136}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.100.136:8848}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  server:
    port: 8092

educloud:
  environment: ${EDUCLOUD_ENVIRONMENT:local}
  order:
    jwt:
      jwks-location: ${ORDER_JWKS_LOCATION:file:/tmp/educloud-live/jwks.json}
      issuer: ${EDUCLOUD_ORDER_JWT_ISSUER:https://issuer.educloud.local}
      audience: ${EDUCLOUD_ORDER_JWT_AUDIENCE:educloud-api}
    internal:
      audience: ${EDUCLOUD_ORDER_INTERNAL_AUDIENCE:educloud-order}
      allowed-client-ids: ${EDUCLOUD_ORDER_INTERNAL_ALLOWED_CLIENT_IDS:gateway,user-service,educloud-course,educloud-payment}
      secret-token: ${EDUCLOUD_ORDER_INTERNAL_SECRET:educloud-internal-secret}

server:
  port: 8091

spring:
  application:
    name: educloud-order
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/educloud_order?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${EDUCLOUD_ORDER_DB_USERNAME:${MYSQL_USERNAME:order_app}}
    password: ${EDUCLOUD_ORDER_DB_PASSWORD:b97ac137f154ee3561da13eb792c502f7e2a4c357ed7cf95}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_DEFAULT_PASS:${RABBITMQ_PASSWORD:guest}}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:educloud}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${EDUCLOUD_ORDER_NACOS_USERNAME:${EDUCLOUD_COURSE_NACOS_USERNAME:educloud_course}}
      password: ${EDUCLOUD_ORDER_NACOS_PASSWORD:${NACOS_COURSE_PASSWORD:19a3b3adbef019a2a0a0b964b14011c33658cb2090d999cd}}
      discovery:
        namespace: ${NACOS_GATEWAY_NAMESPACE:educloud-local}
        group: ${NACOS_GATEWAY_DISCOVERY_GROUP:EDUCLOUD_SERVICES}
        register-enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  server:
    port: 8092

educloud:
  environment: ${EDUCLOUD_ENVIRONMENT:local}
  order:
    jwt:
      jwks-location: ${ORDER_JWKS_LOCATION:file:/tmp/educloud-live/jwks.json}
      issuer: ${EDUCLOUD_ORDER_JWT_ISSUER:https://issuer.educloud.local}
      audience: ${EDUCLOUD_ORDER_JWT_AUDIENCE:educloud-api}
    internal:
      audience: ${EDUCLOUD_ORDER_INTERNAL_AUDIENCE:educloud-order}
      allowed-client-ids: ${EDUCLOUD_ORDER_INTERNAL_ALLOWED_CLIENT_IDS:gateway,user-service,educloud-course,educloud-payment}
      secret-token: ${EDUCLOUD_ORDER_INTERNAL_SECRET:educloud-internal-secret}

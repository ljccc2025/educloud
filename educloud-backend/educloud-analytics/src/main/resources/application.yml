server:
  port: 8101

spring:
  application:
    name: educloud-analytics
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${EDUCLOUD_ANALYTICS_NACOS_USERNAME:${NACOS_ADMIN_USERNAME:nacos}}
      password: ${EDUCLOUD_ANALYTICS_NACOS_PASSWORD:${NACOS_ADMIN_PASSWORD:nacos}}
      discovery:
        username: ${EDUCLOUD_ANALYTICS_NACOS_USERNAME:${NACOS_ADMIN_USERNAME:nacos}}
        password: ${EDUCLOUD_ANALYTICS_NACOS_PASSWORD:${NACOS_ADMIN_PASSWORD:nacos}}
        namespace: ${NACOS_GATEWAY_NAMESPACE:educloud-local}
        group: ${NACOS_GATEWAY_DISCOVERY_GROUP:EDUCLOUD_SERVICES}
        register-enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/educloud_analytics?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${EDUCLOUD_ANALYTICS_DB_USERNAME:${MYSQL_USERNAME:analytics_app}}
    password: ${EDUCLOUD_ANALYTICS_DB_PASSWORD:${EDUCLOUD_ORDER_DB_PASSWORD:b97ac137f154ee3561da13eb792c502f7e2a4c357ed7cf95}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_DEFAULT_PASS:${RABBITMQ_PASSWORD:guest}}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:educloud}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

management:
  server:
    port: 8102
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

educloud:
  environment: ${EDUCLOUD_ENVIRONMENT:prod}
  analytics:
    environment: ${EDUCLOUD_ENVIRONMENT:prod}
    jwt:
      jwks-location: ${ANALYTICS_JWKS_LOCATION:file:/tmp/educloud-live/jwks.json}
      issuer: ${EDUCLOUD_ANALYTICS_JWT_ISSUER:educloud-auth}
      audience: ${EDUCLOUD_ANALYTICS_JWT_AUDIENCE:educloud-web}
    internal:
      audience: ${EDUCLOUD_ANALYTICS_INTERNAL_AUDIENCE:educloud-analytics}
      token: ${INTERNAL_API_TOKEN:educloud-internal-secret}
